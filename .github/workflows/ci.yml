# CI (P0-45, S2-08): every push and pull request to main must pass lint,
# typecheck, unit tests, the production dependency audit, the production
# build, the MySQL integration tests (with the backup/restore drill), the
# end-to-end tests, the QA suite and the origin-lock check (v1.4.0).
# No secrets are needed: the tests use throw-away values only.
name: CI

on:
  push:
    # v1.92.1 (TD-016): release branches (v1921, v193, …) run CI before they reach main.
    branches: [main, "v[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # v1.92.1 (TD-016, D-443): the gate is high and critical advisories in the
      # production dependencies. Moderate and low ones (production and dev) are
      # listed by the next step on every run, as a warning, and handled in a
      # normal release instead of blocking every push.
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all levels and dev dependencies, report only)
        continue-on-error: true
        run: npm audit || echo "::warning title=npm audit::advisories below the gate (moderate / low, or dev-only); see this step's log"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci_root_password
      TEST_DB_ROOT_PASSWORD: ci_root_password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    # v1.53.0: the e2e suite outgrew 45 minutes. v1.92.1 (TD-016): it outgrew 75 too
    # (the e2e step alone took 73 min on aadfe3f8, so the QA and origin steps could
    # never run inside the limit); 120 leaves room for all three.
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CI: "true"
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci_root_password
      TEST_DB_ROOT_PASSWORD: ci_root_password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # v1.54.0: when the runner's package mirror fails (apt exit 100), fall back to the browser alone (the image already has its libraries).
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e
      # Owner's master-prompt QA suite (QA session 14) on the same build.
      - run: npx playwright test -c playwright.qa.config.ts
      # The build started with ORIGIN_SECRET: direct requests are refused (D-102).
      - run: npx playwright test -c playwright.origin.config.ts
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
